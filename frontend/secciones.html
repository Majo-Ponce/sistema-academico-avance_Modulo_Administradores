<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secciones · Sistema Académico</title>
  <link rel="stylesheet" href="/styles.css?v=8" />
</head>
<body>

  <!-- Esta página requiere sesión iniciada en index.html; secciones.js
       redirige automáticamente si no hay un usuario guardado. -->
  <section id="vista-dashboard" class="vista vista-dashboard">
    <nav class="menu-principal" aria-label="Menú principal">
    </nav>

    <header class="barra-superior">
      <div>
        <p class="etiqueta">SISTEMA ACADÉMICO</p>
        <h1>Secciones</h1>
      </div>
      <div class="acciones-barra">
        <span id="chip-usuario" class="chip-usuario"></span>
        <button type="button" id="boton-actualizar" class="boton-secundario">Actualizar</button>
        <button type="button" id="boton-salir" class="boton-secundario">Cerrar sesión</button>
      </div>
    </header>

    <main class="contenido">

      <section class="tarjeta tarjeta-formulario">
        <div class="encabezado-tarjeta">
          <div>
            <h2 id="titulo-formulario-seccion">Nueva sección</h2>
            <p class="descripcion-tarjeta">
              Los campos marcados con * son obligatorios. Asigna asignatura,
              docente, período y horario; el aula es opcional.
            </p>
          </div>
        </div>

        <div id="alerta-seccion" class="alerta oculto" role="alert" aria-live="polite"></div>

        <form id="formulario-seccion" class="rejilla-formulario" novalidate>
          <input type="hidden" id="seccion-id" />

          <div class="campo">
            <label for="seccion-codigo">Código de sección *</label>
            <input id="seccion-codigo" maxlength="10" placeholder="0700" autocomplete="off" />
          </div>
          <div class="campo">
            <label for="seccion-asignatura">Asignatura *</label>
            <select id="seccion-asignatura">
              <option value="">Seleccione una asignatura</option>
            </select>
          </div>

          <div class="campo">
            <label for="seccion-docente">Docente *</label>
            <select id="seccion-docente">
              <option value="">Seleccione un docente</option>
            </select>
          </div>
          <div class="campo">
            <label for="seccion-periodo">Período académico *</label>
            <select id="seccion-periodo">
              <option value="">Seleccione un período</option>
            </select>
          </div>

          <div class="campo">
            <label for="seccion-aula">Aula (opcional)</label>
            <select id="seccion-aula">
              <option value="">Sin aula asignada</option>
            </select>
          </div>
          <div class="campo">
            <label for="seccion-dias">Días *</label>
            <input id="seccion-dias" maxlength="30" placeholder="LU-MI" autocomplete="off" />
          </div>

          <div class="campo">
            <label for="seccion-hora-inicio">Hora de inicio *</label>
            <input id="seccion-hora-inicio" type="time" />
          </div>
          <div class="campo">
            <label for="seccion-hora-fin">Hora de fin *</label>
            <input id="seccion-hora-fin" type="time" />
          </div>

          <div class="campo">
            <label for="seccion-cupo">Cupo máximo (1 a 200) *</label>
            <input id="seccion-cupo" type="number" min="1" max="200" step="1" placeholder="25" autocomplete="off" />
          </div>
          <div class="campo">
            <label for="seccion-estado">Estado *</label>
            <select id="seccion-estado">
              <option value="ABIERTA">ABIERTA</option>
              <option value="CERRADA">CERRADA</option>
              <option value="FINALIZADA">FINALIZADA</option>
            </select>
          </div>

          <div class="acciones-formulario">
            <button type="submit" id="boton-guardar-seccion">Registrar sección</button>
            <button type="button" id="boton-limpiar-seccion" class="boton-secundario">Limpiar formulario</button>
            <button type="button" id="boton-cancelar-edicion-seccion" class="boton-secundario oculto">
              Cancelar edición
            </button>
          </div>
        </form>
      </section>

      <section class="tarjeta tarjeta-tabla">
        <div class="encabezado-tarjeta">
          <div>
            <h2>Secciones registradas</h2>
            <p id="contador-secciones" class="descripcion-tarjeta"></p>
          </div>
          <div class="acciones-barra">
            <select id="seccion-filtro-periodo" class="campo-busqueda">
              <option value="">Todos los períodos</option>
            </select>
            <input
              id="seccion-buscar"
              class="campo-busqueda"
              type="search"
              placeholder="Buscar por código o asignatura..."
            />
            <button type="button" id="boton-recargar-secciones" class="boton-secundario">Recargar</button>
          </div>
        </div>

        <div class="contenedor-tabla">
          <table>
            <thead>
              <tr>
                <th>Código</th>
                <th>Asignatura</th>
                <th>Docente</th>
                <th>Período</th>
                <th>Horario</th>
                <th>Aula</th>
                <th>Cupo</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla-secciones"></tbody>
          </table>
        </div>
        <p id="texto-secciones-estado" class="texto-vacio oculto"></p>
      </section>

    </main>
  </section>

  <script src="/auth.js?v=6"></script>
  <script src="/menu-admin.js?v=3"></script>
  <script src="/secciones.js?v=6"></script>
</body>
</html>
